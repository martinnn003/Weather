<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather — 10-Day Forecast</title>
  <meta name="description" content="Live weather and a 10-day forecast for any city in the world, powered by Open-Meteo. Search any location or use your own.">
  <meta name="theme-color" content="#0ea5e9">
  <meta property="og:title" content="Weather Forecast">
  <meta property="og:description" content="Live weather and a 10-day forecast for any city, powered by Open-Meteo.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="brand" id="brand">☀️ Weather</div>
    <div class="search">
      <input id="search-input" type="text" placeholder="Search for a city…" autocomplete="off"
        role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list" aria-label="Search for a city">
      <ul id="search-results" role="listbox" aria-label="City search results" hidden></ul>
    </div>
    <div class="controls">
      <button id="geo-btn" class="icon-btn" type="button" title="Use my location" aria-label="Use my location">📍</button>
      <button id="radar-btn" class="icon-btn" type="button" title="Precipitation radar" aria-label="Precipitation radar" aria-pressed="false">🛰️</button>
      <div class="seg-toggle" id="unit-toggle" role="group" aria-label="Temperature unit">
        <button id="unit-c" type="button" aria-pressed="true">°C</button>
        <button id="unit-f" type="button" aria-pressed="false">°F</button>
      </div>
      <div class="seg-toggle" id="lang-toggle" role="group" aria-label="Language">
        <button id="lang-bg" type="button" lang="bg" aria-pressed="false">БГ</button>
        <button id="lang-en" type="button" lang="en" aria-pressed="true">EN</button>
      </div>
    </div>
  </header>

  <main class="content">
    <nav class="favorites" id="favorites" aria-label="Saved cities" hidden></nav>

    <!-- Placeholder that mirrors the layout while data loads (display: contents,
         so its two panels drop straight into the page grid). -->
    <div class="skeleton" id="skeleton" role="status" aria-label="Loading weather" hidden>
      <div class="panel">
        <div class="sk sk-title"></div>
        <div class="sk sk-temp"></div>
        <div class="sk sk-cond"></div>
        <div class="sk-tiles">
          <div class="sk sk-tile"></div><div class="sk sk-tile"></div>
          <div class="sk sk-tile"></div><div class="sk sk-tile"></div>
          <div class="sk sk-tile"></div><div class="sk sk-tile"></div>
        </div>
      </div>
      <div class="panel sk-forecast">
        <div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
        <div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
        <div class="sk sk-day"></div><div class="sk sk-day"></div><div class="sk sk-day"></div>
        <div class="sk sk-day"></div>
      </div>
    </div>

    <section class="now panel" id="now" hidden>
      <div class="now-head">
        <h1 id="city">Loading…</h1>
        <div class="now-actions">
          <button id="fav-btn" class="icon-btn" type="button" title="Save this city" aria-label="Save this city" aria-pressed="false">☆</button>
          <button id="share-btn" class="icon-btn" type="button" title="Copy link" aria-label="Copy link">🔗</button>
        </div>
      </div>
      <p class="subtitle" id="subtitle">10-Day Weather Forecast</p>
      <div class="temp" id="temp">–</div>
      <div class="cond" id="cond"></div>
      <div class="details" id="details"></div>
    </section>

    <div class="main-col">
      <section class="forecast panel" id="forecast" aria-label="10-day forecast"></section>
      <section class="hourly panel" id="hourly" aria-label="Hourly forecast" hidden></section>
      <section class="radar panel" id="radar" aria-label="Precipitation radar" hidden>
        <div class="radar-head"><span id="radar-time"></span></div>
        <div class="radar-map" id="radar-map"></div>
      </section>
    </div>

    <p class="error" id="error" role="alert" hidden></p>
  </main>

  <footer id="footer">Live data from <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="script.js"></script>
</body>
</html>
